[package]
name = "seah"
version = "0.1.0"
description = "Personal finance app (desktop + Android)"
authors = ["derikgm"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "seah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
# "s" optimiza tamaño (el scaffold traía 3 = máximo rendimiento).
# Usa "z" para exprimir unos KB más a costa de algo de rendimiento.
opt-level = "s"
panic = "abort"
strip = true
